
syntax = "proto3";

package task;

service TaskService {
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);
}

message TaskRequest {
  int64 task_id = 1;
  int64 start = 2;
  int64 end = 3;
  int64 step = 4;
  bytes environment_data = 5;      // Serialized environment struct (scalars + placeholder pointer bytes)
  uint64 environment_size = 6;     // Size of environment struct (bytes)
  string function_name = 7;        // e.g., "wrapper"

  // NEW: Outlined LLVM IR / bitcode for this task
  bytes ir_data = 8;               // Outlined LLVM IR or bitcode
  string ir_format = 9;            // "ll" or "bc"

  // NEW: Logical array payloads for pointer fields in env
  repeated EnvArrayField arrays = 10;
}

message TaskResponse {
  int64 task_id = 1;
  bool success = 2;
  bytes result_data = 3;            // Serialized results (updated environment)
  uint64 result_size = 4;           // Size of result data
  string error_message = 5;
  map<int64, bytes> iteration_outputs = 6;  // Per-iteration outputs if needed
  repeated EnvArrayField arrays = 7;  // Logical array payloads for updated env fields (safe for merging)
}

// Describes one pointer-array field's payload
message EnvArrayField {
  uint32 field_index = 1; // Index of the pointer field in env struct
  uint64 length = 2;      // Number of elements
  bytes data = 3;         // Raw bytes of the contiguous array
}

